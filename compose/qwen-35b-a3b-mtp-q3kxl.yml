# ===========================================================================
# Profile: Qwen3.6-35B-A3B + MTP (Q3_K_XL, ctx 262K — quality dip for VRAM)
# Engine:  llama.cpp (PR #22673)
# Baseline: 138/138 TPS @ 262K (no MTP, Q4_K_XL)
# Purpose: Compare to mtp-q4kxl.yml — does smaller weights + full ctx win?
#
# VRAM (24 GB):
#   Q3_K_XL weights              ~13.5 GB
#   KV at 262K q4_0              ~4.5 GB
#   mmproj F16                   ~0.8 GB
#   MTP overhead                 ~2.5 GB
#   total                        ~21.3 GB → 2.7 GB headroom

services:
  llamacpp-qwen36-35b-a3b-mtp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llamacpp-qwen36-35b-a3b-mtp
    restart: "no"
    healthcheck:
      disable: true
    ports:
      - "${PORT:-8020}:8000"
    volumes:
      - ${MODEL_DIR:?set MODEL_DIR}/qwen3.6-35b-a3b-gguf-mtp:/models:ro
    environment:
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint:
      - bash
      - -c
      - |
        set -e
        EXTRA_ARGS=()
        if [ "$${DISABLE_THINKING:-1}" = "1" ]; then
          EXTRA_ARGS+=("--chat-template-kwargs" '{"enable_thinking":false}')
          echo "[entrypoint] DISABLE_THINKING=1"
        fi
        exec /app/llama-server "$$@" "$${EXTRA_ARGS[@]}"
      - --
    command:
      - --model
      - /models/unsloth/Qwen3.6-35B-A3B-UD-Q3_K_XL.gguf
      - --mmproj
      - /models/unsloth/mmproj-F16.gguf
      - --alias
      - qwen3.6-35b-a3b-mtp
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --n-gpu-layers
      - "999"
      - --ctx-size
      - "${CTX_SIZE:-262144}"
      - --parallel
      - "1"
      - --kv-unified
      - --ctx-checkpoints
      - "1"
      - --flash-attn
      - "on"
      - --cache-type-k
      - "${KV_TYPE:-q4_0}"
      - --cache-type-v
      - "${KV_TYPE:-q4_0}"
      - --jinja
      - --no-mmproj-offload
      - "-fit"
      - "off"
      - --no-mmap
      - --no-warmup
      - --reasoning-format
      - "${REASONING_FORMAT:-none}"
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - "${MTP_N_MAX:-2}"
